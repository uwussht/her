name: her_circle
description: "Her Circle — women's health, learning and shopping platform for Kazakhstan."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cached_network_image: ^4.0.1
  chewie: ^1.17.2
  cloud_firestore: ^6.10.0
  dio: ^5.11.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  table_calendar: ^3.2.1
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  hive_ce_generator: ^1.11.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Bundled Nunito (OFL) so text renders offline and google_fonts never
    # needs a network fetch. Covers the full Kazakh Cyrillic set and ₸.
    - assets/google_fonts/
    # Mock JSON content used until Firebase is connected (steps 4+).
    - assets/mock/
